# Fork-only cross-platform verification: the Windows port builds and is tested, and Linux and macOS behave as at
# the base commit. Not part of any upstream proposal.
#
# Runs only when something is proposed for main, and on demand, so a merge is judged by:
#   required: hygiene, windows-build, windows-lint, unix-compare (Linux and macOS behave as at the base commit)
#   informational: windows-test (set the repository variable HAFT_WINDOWS_TESTS_REQUIRED to true to require it)
name: Cross-platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_SHA: e0c63f4b6e53c51e4867bdab0148b42d7e7a8d38
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Copy of scripts/haft-win/slow-packages.txt in the eco repo (measured on Windows, 2026-11-02).
  SLOW_PACKAGES: >-
    github.com/m0n0x41d/haft/internal/artifact
    github.com/m0n0x41d/haft/internal/cli
    github.com/m0n0x41d/haft/internal/codebase
    github.com/m0n0x41d/haft/internal/core/delivery
    github.com/m0n0x41d/haft/cmd/indexer

jobs:
  hygiene:
    name: Hygiene (identity, LF, blobs, tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Commits are by sashml or crafteng, without attribution lines
        run: |
          bad=$(git log --format='%ae%n%ce' "$BASE_SHA..$HEAD_SHA" | sort -u |
            grep -vxF -e 'sashml@users.noreply.github.com' \
                      -e '317125206+crafteng@users.noreply.github.com' || true)
          if [ -n "$bad" ]; then echo "foreign identity: $bad" >&2; exit 1; fi
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -inE '^co-authored-by:|generated with'; then
            echo "attribution line found" >&2; exit 1
          fi
      - name: Changed files are LF; no binaries, no blob over 1 MiB, no exe tracked
        run: |
          git diff -z --name-only --diff-filter=AMR "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.z"
          crlf=$(xargs -0 -r -a "$RUNNER_TEMP/changed.z" git ls-files --eol -- | awk '$1 ~ /^i\/(crlf|mixed)$/')
          binary=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk -F'\t' '$1 == "-" && $2 == "-"')
          big=$(git rev-list --objects "$BASE_SHA..$HEAD_SHA" |
            git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' |
            awk '$1 == "blob" && $2 > 1048576')
          exe=$(git ls-files -- '*.exe' '*.exe~')
          fail=0
          for v in crlf binary big exe; do
            if [ -n "${!v}" ]; then printf '%s:\n%s\n' "$v" "${!v}" >&2; fail=1; fi
          done
          exit "$fail"
      - name: go mod tidy reports nothing
        run: go mod tidy -diff

  windows-build:
    name: Windows build, vet, smoke
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require Go from go.mod and a cgo C compiler
        run: |
          go version
          gcc --version | head -n 1
          test "$(go env CGO_ENABLED)" = 1
      - name: Prepare desktop embed placeholder (as upstream ci.yml)
        run: |
          mkdir -p desktop/frontend/dist
          printf 'ci placeholder\n' > desktop/frontend/dist/.ci-placeholder
      - run: go build ./...
      - run: go vet ./...
      - name: Build haft10.exe and smoke it
        run: |
          go build -trimpath -ldflags "-X main.Version=ci" -o "$RUNNER_TEMP/haft10.exe" ./cmd/haft10/
          "$RUNNER_TEMP/haft10.exe" version | grep -F '"format":"haft.version/1"'
          response=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' |
            timeout 20 "$RUNNER_TEMP/haft10.exe" serve 2>/dev/null | head -n 1)
          printf '%s\n' "$response" | grep -F '"serverInfo"'
      - name: Build haft.exe and smoke the MCP server (as upstream ci.yml)
        run: |
          go build -trimpath -o "$RUNNER_TEMP/haft.exe" ./cmd/haft/
          response=$(printf '%s\n' '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{}}' |
            timeout 20 "$RUNNER_TEMP/haft.exe" serve 2>/dev/null)
          printf '%s\n' "$response" | grep -F '"protocolVersion"'
          printf '%s\n' "$response" | grep -F '"serverInfo":{"name":"haft","version":"dev"}'

  windows-lint:
    name: Windows lint (new issues only)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare desktop embed placeholder (as upstream ci.yml)
        shell: bash
        run: |
          mkdir -p desktop/frontend/dist
          printf 'ci placeholder\n' > desktop/frontend/dist/.ci-placeholder
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --timeout=15m --new-from-rev=${{ env.BASE_SHA }}

  windows-test:
    name: Windows tests (${{ matrix.wave }})
    needs: [windows-build]
    runs-on: windows-2025
    timeout-minutes: 150
    continue-on-error: ${{ vars.HAFT_WINDOWS_TESTS_REQUIRED != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        wave: [slow, rest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare desktop embed placeholder (as upstream ci.yml)
        run: |
          mkdir -p desktop/frontend/dist
          printf 'ci placeholder\n' > desktop/frontend/dist/.ci-placeholder
      - name: Run tests in an isolated profile
        id: test
        run: |
          out="$RUNNER_TEMP/gotest-windows-${{ matrix.wave }}"
          mkdir -p "$out"
          # Pin the Go caches before moving the profile: their defaults live under USERPROFILE and LOCALAPPDATA.
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          root='${{ runner.temp }}\ht'
          root_u=$(cygpath -u "$root")
          mkdir -p "$root_u/home/AppData/Local" "$root_u/home/AppData/Roaming" "$root_u/tmp"
          printf '[core]\n\tautocrlf = input\n' > "$root_u/gitconfig"
          export HOME="$root\\home" USERPROFILE="$root\\home"
          export LOCALAPPDATA="$root\\home\\AppData\\Local" APPDATA="$root\\home\\AppData\\Roaming"
          export TEMP="$root\\tmp" TMP="$root\\tmp"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL="$root\\gitconfig"
          export GIT_AUTHOR_NAME=haft-test GIT_AUTHOR_EMAIL=haft-test@example.invalid
          export GIT_COMMITTER_NAME=haft-test GIT_COMMITTER_EMAIL=haft-test@example.invalid
          slow=$(printf '%s\n' $SLOW_PACKAGES)
          if [ "${{ matrix.wave }}" = slow ]; then
            pkgs=$slow; budget=90m
          else
            pkgs=$(go list ./... | grep -vxF "$slow"); budget=20m
          fi
          set +e
          # shellcheck disable=SC2086
          go test -json -count=1 -timeout "$budget" $pkgs > "$out/gotest.json" 2> "$out/stderr.txt"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          find "$root_u/tmp" -mindepth 1 -maxdepth 1 -type d | wc -l > "$out/leaked-tempdirs.txt"
      - name: Summarize
        if: ${{ always() }}
        run: |
          f="$RUNNER_TEMP/gotest-windows-${{ matrix.wave }}/gotest.json"
          {
            echo "### Windows tests (${{ matrix.wave }}) at $HEAD_SHA"
            echo "packages: $(jq -rR 'fromjson? | select(.Test == null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | .Action' "$f" | sort | uniq -c | tr '\n' ' ')"
            echo "top-level tests: $(jq -rR 'fromjson? | select(.Test != null and (.Test | contains("/") | not) and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | .Action' "$f" | sort | uniq -c | tr '\n' ' ')"
            echo "package timeouts: $(jq -rR 'fromjson? | select(.Action == "output" and ((.Output // "") | startswith("panic: test timed out"))) | .Package' "$f" | sort -u | tr '\n' ' ')"
            echo "leaked temp dirs: $(cat "$RUNNER_TEMP/gotest-windows-${{ matrix.wave }}/leaked-tempdirs.txt")"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gotest-windows-${{ matrix.wave }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/gotest-windows-${{ matrix.wave }}
          if-no-files-found: error
          retention-days: 30
      - name: Fail on test failures
        run: exit "${{ steps.test.outputs.rc }}"

  unix-test:
    name: ${{ matrix.goos }} tests (${{ matrix.tree }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux,  tree: base }
          - { runner: ubuntu-latest, goos: linux,  tree: head }
          - { runner: macos-latest,  goos: darwin, tree: base }
          - { runner: macos-latest,  goos: darwin, tree: head }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.tree == 'base' && env.BASE_SHA || env.HEAD_SHA }}
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare desktop embed placeholder (as upstream ci.yml)
        run: |
          mkdir -p desktop/frontend/dist
          printf 'ci placeholder\n' > desktop/frontend/dist/.ci-placeholder
      - name: Build (links every main package natively) and vet, with cgo
        run: |
          test "$(go env CGO_ENABLED)" = 1
          go build ./...
          go vet ./...
      - name: Smoke the MCP server (as upstream ci.yml and install-test.yml)
        timeout-minutes: 2
        run: |
          go build -trimpath -o "$RUNNER_TEMP/haft" ./cmd/haft/
          response=$(printf '%s\n' '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{}}' |
            "$RUNNER_TEMP/haft" serve 2>/dev/null)
          printf '%s\n' "$response" | grep -F '"protocolVersion"'
      - name: Build haft10 and smoke it
        timeout-minutes: 2
        run: |
          go build -trimpath -ldflags "-X main.Version=ci" -o "$RUNNER_TEMP/haft10" ./cmd/haft10/
          "$RUNNER_TEMP/haft10" version | grep -F '"format":"haft.version/1"'
      - name: Run tests (judged by unix-compare)
        run: |
          out="$RUNNER_TEMP/gotest-${{ matrix.goos }}-${{ matrix.tree }}"
          mkdir -p "$out"
          set +e
          go test -json -count=1 -timeout=90m -skip '^TestP13ConsolidatedAcceptance$' ./... \
            > "$out/gotest.json" 2> "$out/stderr.txt"
          echo "go test rc=$?"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gotest-${{ matrix.goos }}-${{ matrix.tree }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/gotest-${{ matrix.goos }}-${{ matrix.tree }}
          if-no-files-found: error
          retention-days: 30

  unix-compare:
    name: Linux and macOS unchanged (main vs head)
    needs: [unix-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gotest-*-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/gotest
      - name: No test that passes at main fails, skips or disappears at head
        run: |
          cd "$RUNNER_TEMP/gotest"
          rows() {
            jq -rR 'fromjson? | select(.Test != null and (.Test | contains("/") | not)
              and (.Action == "pass" or .Action == "fail" or .Action == "skip"))
              | [.Package, .Test, .Action] | @tsv' "$1" | sort -u
          }
          status=0
          for os in linux darwin; do
            base="gotest-$os-base-$HEAD_SHA/gotest.json"
            head="gotest-$os-head-$HEAD_SHA/gotest.json"
            if [ ! -s "$base" ] || [ ! -s "$head" ]; then echo "$os: missing results" >&2; status=1; continue; fi
            rows "$base" > "$os-base.tsv"
            rows "$head" > "$os-head.tsv"
            awk -F'\t' '$3 == "pass" {print $1 "\t" $2}' "$os-base.tsv" | sort -u > "$os-base-pass"
            awk -F'\t' '$3 == "pass" {print $1 "\t" $2}' "$os-head.tsv" | sort -u > "$os-head-pass"
            awk -F'\t' '$3 == "fail" {print $1 "\t" $2}' "$os-head.tsv" | sort -u > "$os-head-fail"
            cut -f1,2 "$os-base.tsv" | sort -u > "$os-base-all"
            comm -23 "$os-base-pass" "$os-head-pass" > "$os-regressed"
            comm -23 "$os-head-fail" "$os-base-all" > "$os-new-failing"
            {
              echo "### $os: main vs head"
              echo "main: $(cut -f3 "$os-base.tsv" | sort | uniq -c | tr '\n' ' ')"
              echo "head: $(cut -f3 "$os-head.tsv" | sort | uniq -c | tr '\n' ' ')"
              echo "regressed: $(wc -l < "$os-regressed"); new and failing: $(wc -l < "$os-new-failing")"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$os-regressed" ] || [ -s "$os-new-failing" ]; then
              cat "$os-regressed" "$os-new-failing" >&2
              status=1
            fi
          done
          exit "$status"
